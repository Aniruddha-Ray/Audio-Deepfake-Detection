name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: src}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: src/requirements-dev.txt}
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/deploy/Dockerfile -t audiodf:ci src
